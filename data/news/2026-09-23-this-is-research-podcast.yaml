date: 2026-09-23
subtitle: "On the This IS Research podcast, with Jan Recker and Nick Berente"
title: "Welcome, AI Reviewer Two"
url: "https://www.janrecker.com/this-is-research-podcast/welcome-ai-reviewer-two-23-september-2026/"
body: "It is difficult to speed up the review process. And we need to figure out a way to decrease the burden on human reviewers, while using the new AI tools at our disposal to improve our research. That's why, on This IS Research, we've described our proposal to fight fire with fire and infuse AI tools into the review process. Every author submitting to WORTH 2027 will get a Refine.ink review of their submission — and if you're interested in reviewing, please sign up."
